<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inside Out - Mind Headquarters</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Poppins', sans-serif; color: #ffffff; min-height: 100vh; overflow-x: hidden; text-align: center; position: relative; background: #050716; }

        /* --- VIDEO BACKGROUND --- */
        .video-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; }
        .video-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 7, 22, 0.55); z-index: -1; }

        /* --- NAVIGATION --- */
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; background: rgba(11, 17, 44, 0.75); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        .logo { font-family: 'Cinzel', serif; font-size: 1.4rem; font-weight: 700; color: #ffd700; letter-spacing: 2px; }
        .nav-links { display: flex; list-style: none; gap: 25px; }
        .nav-links a { color: #b0b5c9; text-decoration: none; font-weight: 500; transition: 0.3s; }
        .nav-links a:hover, .nav-links a.active { color: #ffffff; border-bottom: 2px solid #ffd700; }

        /* --- HERO --- */
        .hero { padding: 80px 20px; }
        .hero h1 { font-family: 'Cinzel', serif; font-size: 3rem; margin-bottom: 30px; text-shadow: 0 4px 15px rgba(0,0,0,0.9); }
        .core-orb { width: 180px; height: 180px; border-radius: 50%; margin: 0 auto 40px; background: radial-gradient(circle at 30% 30%, #fff 0%, #ffd700 40%, #ff8c00 80%); box-shadow: 0 0 40px 15px rgba(255, 215, 0, 0.6); animation: float 4s ease-in-out infinite; transition: 0.5s; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }

        /* --- EMOTIONS --- */
        .emotion-section { padding: 40px 20px; max-width: 1000px; margin: 0 auto; }
        .emotion-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 30px; margin: 40px 0; }
        .emotion-sphere { background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.15); border-radius: 15px; padding: 20px; cursor: pointer; transition: 0.3s; backdrop-filter: blur(5px); }
        .emotion-sphere:hover, .emotion-sphere.active { transform: scale(1.08); box-shadow: 0 0 25px #ffd700; border-color: #ffd700; }
        .sphere-icon { font-size: 2.5rem; margin-bottom: 10px; display: block; }

        .display-panel { background: linear-gradient(135deg, #fffbf0 0%, #f4e8c1 100%); color: #2b2311; padding: 35px; border-radius: 12px; max-width: 550px; margin: 40px auto; border-left: 5px solid #ffd700; text-align: left; }
    </style>
</head>

<body onclick="enableAudio()"> <video autoplay loop playsinline id="bg-video" class="video-bg">
        <source src="https://videotourl.com/videos/1780485019352-0868a29f-d876-44ca-b1f7-322c6c4baa89.mp4" type="video/mp4">
    </video>
    <div class="video-overlay"></div>

    <header>
        <div class="logo">Inside Out</div>
        <ul class="nav-links">
            <li><a href="index.html" class="active">Home</a></li>
            <li><a href="AboutUs.html">About Us</a></li>
            <li><a href="Design.html">Design</a></li>
            <li><a href="product.html">Product</a></li>
        </ul>
    </header>

    <section class="hero">
        <h1>WELCOME TO OUR<br>INSIDE OUT WEBSITE</h1>
        <div class="core-orb" id="main-orb"></div>
    </section>

    <section class="emotion-section">
        <div class="emotion-grid">
            <div class="emotion-sphere sphere-joy active" onclick="changeEmotion('joy')"><span class="sphere-icon">💛</span><h3>JOY</h3></div>
            <div class="emotion-sphere" onclick="changeEmotion('sadness')"><span class="sphere-icon">💙</span><h3>SADNESS</h3></div>
            <div class="emotion-sphere" onclick="changeEmotion('anger')"><span class="sphere-icon">❤️</span><h3>ANGER</h3></div>
            <div class="emotion-sphere" onclick="changeEmotion('envy')"><span class="sphere-icon">💚</span><h3>ENVY</h3></div>
        </div>

        <div class="display-panel" id="emotion-card">
            <h2 id="emotion-title">Joy (Kegembiraan)</h2>
            <p id="emotion-desc">Manifestasi emosi utama berwujud penuh cahaya kuning cerah yang bertindak sebagai pemimpin pusat kendali.</p>
        </div>
    </section>
        
    <script>
        // FUNGSI AKTIVASI SUARA (Browser melarang autoplay suara, jadi butuh 1 kali klik user)
        function enableAudio() {
            var video = document.getElementById('bg-video');
            video.muted = false;
        }

        const emotionData = {
            joy: { title: "Joy (Kegembiraan)", desc: "Optimisme yang meluap-luap, berenergi tinggi, dan memastikan memori inti tetap bersinar.", color: "#ffd700" },
            sadness: { title: "Sadness (Kesedihan)", desc: "Emosi biru melankolis yang penting untuk memicu empati dan memberi tahu saat butuh pertolongan.", color: "#0088ff" },
            anger: { title: "Anger (Kemarahan)", desc: "Sangat reaktif dan tegas. Melindungi hak agar segala hal berjalan dengan adil.", color: "#ff3333" },
            envy: { title: "Envy (Iri Hati)", desc: "Mudah cemburu tapi ambisius. Memotivasi untuk menggapai hal baru yang keren.", color: "#00ffcc" }
        };

        function changeEmotion(key) {
            document.getElementById('emotion-title').innerText = emotionData[key].title;
            document.getElementById('emotion-desc').innerText = emotionData[key].desc;
            document.getElementById('emotion-card').style.borderColor = emotionData[key].color;
            document.getElementById('main-orb').style.boxShadow = `0 0 50px ${emotionData[key].color}`;
        }
    </script>
</body>
</html>
