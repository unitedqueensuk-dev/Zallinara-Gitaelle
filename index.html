<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inside Out - Mind Headquarters</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Poppins', sans-serif; color: #ffffff; min-height: 100vh; overflow-x: hidden; text-align: center; background: #050716; }

        /* --- BACKGROUND VIDEO --- */
        .video-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
        }
        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 7, 22, 0.6);
            z-index: -1;
        }

        /* --- HEADER --- */
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; background: rgba(11, 17, 44, 0.7); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .logo { font-family: 'Cinzel', serif; font-size: 1.5rem; font-weight: 700; color: #ffd700; letter-spacing: 2px; }
        .nav-links { display: flex; list-style: none; gap: 25px; }
        .nav-links a { color: #b0b5c9; text-decoration: none; transition: 0.3s; font-weight: 500; }
        .nav-links a:hover, .nav-links a.active { color: #fff; border-bottom: 2px solid #ffd700; }

        /* --- HERO --- */
        .hero { padding: 80px 20px; }
        .core-orb {
            width: 180px; height: 180px; border-radius: 50%; margin: 0 auto 30px;
            background: radial-gradient(circle at 30% 30%, #fff, #ffd700);
            box-shadow: 0 0 40px #ffd700;
            animation: float 4s ease-in-out infinite;
            transition: all 0.5s ease;
        }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }

        /* --- EMOTION GRID --- */
        .emotion-section { padding: 40px 20px; max-width: 900px; margin: 0 auto; }
        .emotion-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .sphere { 
            background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2); 
            padding: 20px; border-radius: 15px; cursor: pointer; transition: 0.3s; backdrop-filter: blur(5px);
        }
        .sphere:hover, .sphere.active { transform: scale(1.1); border-color: #ffd700; }
        
        .display-panel { 
            background: #f4e8c1; color: #2b2311; padding: 30px; border-radius: 15px; 
            max-width: 600px; margin: 0 auto; border-left: 8px solid #ffd700; text-align: left;
        }
    </style>
</head>

<body>

    <!-- VIDEO BACKGROUND -->
    <video autoplay muted loop playsinline class="video-bg">
        <source src="https://videotourl.com/videos/1780485019352-0868a29f-d876-44ca-b1f7-322c6c4baa89.mp4" type="video/mp4">
    </video>
    <div class="video-overlay"></div>

    <header>
        <div class="logo">Inside Out</div>
        <ul class="nav-links">
            <li><a href="index.html" class="active">Home</a></li>
            <li><a href="AboutUs.html">About Us</a></li>
            <li><a href="Design.html">Design</a></li>
            <li><a href="product.html">Product</a></li>
        </ul>
    </header>

    <section class="hero">
        <h1>INSIDE OUT HEADQUARTERS</h1>
        <div class="core-orb" id="main-orb"></div>
        <p>Discover your dominant emotion</p>
    </section>

    <section class="emotion-section">
        <div class="emotion-grid">
            <div class="sphere active" id="joy" onclick="updateEmotion('joy')">💛<h3>JOY</h3></div>
            <div class="sphere" id="sadness" onclick="updateEmotion('sadness')">💙<h3>SADNESS</h3></div>
            <div class="sphere" id="anger" onclick="updateEmotion('anger')">❤️<h3>ANGER</h3></div>
            <div class="sphere" id="envy" onclick="updateEmotion('envy')">💚<h3>ENVY</h3></div>
        </div>

        <div class="display-panel" id="panel">
            <h2 id="title">Joy (Kegembiraan)</h2>
            <p id="desc">Manifestasi emosi utama berwujud penuh cahaya kuning cerah yang bertindak sebagai pemimpin pusat kendali.</p>
        </div>
    </section>

    <script>
        const data = {
            joy: {t: "Joy (Kegembiraan)", d: "Optimisme yang meluap-luap, berenergi tinggi, dan memastikan memori inti tetap bersinar.", c: "#ffd700", b: "radial-gradient(circle at 30% 30%, #fff, #ffd700)"},
            sadness: {t: "Sadness (Kesedihan)", d: "Emosi biru melankolis yang penting untuk memicu empati dan memberi tahu orang lain saat butuh pertolongan.", c: "#0088ff", b: "radial-gradient(circle at 30% 30%, #fff, #0088ff)"},
            anger: {t: "Anger (Kemarahan)", d: "Sangat reaktif dan tegas. Melindungi hak agar segala hal berjalan dengan adil.", c: "#ff3333", b: "radial-gradient(circle at 30% 30%, #fff, #ff3333)"},
            envy: {t: "Envy (Iri Hati)", d: "Mungil namun ambisius. Memotivasi untuk menggapai hal baru yang keren.", c: "#00ffcc", b: "radial-gradient(circle at 30% 30%, #fff, #00ffcc)"}
        };

        function updateEmotion(key) {
            document.getElementById('title').innerText = data[key].t;
            document.getElementById('desc').innerText = data[key].d;
            document.getElementById('panel').style.borderColor = data[key].c;
            
            const orb = document.getElementById('main-orb');
            orb.style.background = data[key].b;
            orb.style.boxShadow = `0 0 50px ${data[key].c}`;

            document.querySelectorAll('.sphere').forEach(s => s.classList.remove('active'));
            document.getElementById(key).classList.add('active');
        }
    </script>
</body>
</html>
