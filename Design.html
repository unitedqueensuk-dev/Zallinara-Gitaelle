<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design - Inside Out</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #050716; color: #fff; margin: 0; padding: 20px; text-align: center; }
        
        .design-container {
            max-width: 900px;
            margin: 40px auto;
            background: rgba(11, 17, 44, 0.8);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid #ffd700;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h1 { font-family: 'Cinzel', serif; color: #ffd700; margin-bottom: 20px; }

        /* Container Canva yang responsif */
        .canva-wrapper {
            position: relative;
            width: 100%;
            height: 0;
            padding-top: 56.25%; /* Rasio 16:9 */
            overflow: hidden;
            border-radius: 12px;
            border: 2px solid #ffd700;
            background: #000;
        }

        .canva-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .credit-text {
            margin-top: 20px;
            color: #b0b5c9;
            font-size: 0.9rem;
        }

        .credit-text a {
            color: #ffd700;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="design-container">
        <h1>PROJECT DESIGN</h1>
        
        <div class="canva-wrapper">
            <iframe loading="lazy" src="https://www.canva.com/design/DAHJDnpXhmE/qfJUwasbPDex14GgZQZtFw/view?embed" 
                allowfullscreen="allowfullscreen" allow="fullscreen">
            </iframe>
        </div>

        <div class="credit-text">
            <p>Zallinara Gitaelle X-E (Project) !</p>
            <p>Design by <a href="#">Allisa, Gita, Nirina & Zahra</a></p>
        </div>
    </div>

</body>
</html>
