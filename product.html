<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inside Out - Send the Song</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Poppins', sans-serif; background: #050716; color: white; padding: 20px; text-align: center; }
        .card { max-width: 500px; margin: 20px auto; background: rgba(255,255,255,0.05); padding: 20px; border-radius: 15px; border: 1px solid #ffd700; }
        input, textarea { width: 100%; padding: 10px; margin: 5px 0; border-radius: 8px; border: none; background: #1a1e35; color: white; }
        button { background: #ffd700; color: #050716; padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .mood-box { display: flex; justify-content: space-around; margin: 10px 0; }
        .mood-btn { cursor: pointer; padding: 5px; border: 2px solid transparent; border-radius: 5px; }
        .mood-btn.active { border-color: white; }
        .song-item { border-bottom: 1px solid #333; padding: 10px; text-align: left; }
    </style>
</head>
<body>

    <h1>Send the Song</h1>
    
    <!-- FORM INPUT -->
    <div class="card">
        <input type="text" id="username" placeholder="Username IG Tujuan">
        <div class="mood-box" id="moodSelector">
            <div class="mood-btn" onclick="selectMood('Joy 💛')">Joy 💛</div>
            <div class="mood-btn" onclick="selectMood('Sadness 💙')">Sadness 💙</div>
            <div class="mood-btn" onclick="selectMood('Anger ❤️')">Anger ❤️</div>
            <div class="mood-btn" onclick="selectMood('Envy 💚')">Envy 💚</div>
        </div>
        <input type="text" id="spotifyLink" placeholder="Link Spotify">
        <textarea id="message" placeholder="Pesan..."></textarea>
        <button onclick="saveData()">Kirim Lagu</button>
    </div>

    <!-- SEARCH & LIST -->
    <div class="card">
        <input type="text" id="search" placeholder="Cari nama tujuan..." onkeyup="filterSongs()">
        <div id="songList"></div>
    </div>

    <script>
        // 1. SETUP FIREBASE (Ganti dengan config punyamu)
        const firebaseConfig = {
            databaseURL: "https://YOUR_PROJECT_ID.firebasedatabase.app/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database().ref("songs");

        let selectedMood = '';
        function selectMood(m) { selectedMood = m; alert("Mood: " + m); }

        // 2. SIMPAN KE DATABASE
        function saveData() {
            const data = {
                to: document.getElementById('username').value,
                mood: selectedMood,
                link: document.getElementById('spotifyLink').value,
                msg: document.getElementById('message').value
            };
            db.push(data);
            alert("Berhasil Terkirim!");
        }

        // 3. TAMPILKAN DATA
        db.on("value", (snapshot) => {
            const list = document.getElementById('songList');
            list.innerHTML = "";
            snapshot.forEach((child) => {
                const s = child.val();
                list.innerHTML += `<div class="song-item" data-name="${s.to}">
                    <strong>${s.to}</strong> (${s.mood})<br>
                    <small>${s.msg}</small><br>
                    <a href="${s.link}" target="_blank">Dengarkan Lagu</a>
                </div>`;
            });
        });

        // 4. SEARCH
        function filterSongs() {
            const query = document.getElementById('search').value.toLowerCase();
            document.querySelectorAll('.song-item').forEach(item => {
                item.style.display = item.getAttribute('data-name').toLowerCase().includes(query) ? 'block' : 'none';
            });
        }
    </script>
</body>
</html>
