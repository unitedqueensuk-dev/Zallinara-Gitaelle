<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <title>Send the Song - Inside Out</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        /* CSS tetap sama seperti sebelumnya, fokus pada perubahan struktur HTML/JS */
        body { font-family: 'Poppins', sans-serif; background: #050716; color: #fff; min-height: 100vh; }
        .container { max-width: 800px; margin: 40px auto; padding: 20px; }
        .card { background: rgba(11, 17, 44, 0.8); padding: 25px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); }
        .form-control { width: 100%; padding: 12px; background: #050716; border: 1px solid #444; color: #fff; border-radius: 8px; margin-bottom: 15px; }
        .btn-send { width: 100%; padding: 12px; background: #ffd700; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
        #rekomendasiArea { margin-top: 20px; color: #b0b5c9; }
    </style>
</head>
<body>

    <main class="container">
        <h1 style="text-align:center; color:#ffd700;">SEND THE SONG</h1>
        
        <div class="card">
            <h2>Pilih Mood & Kirim Lagu</h2>
            <div class="form-group">
                <label>Pilih Mood Emosi Kamu:</label>
                <select id="songMood" class="form-control" onchange="tampilkanRekomendasi()">
                    <option value="joy">1. Joy (Senang)</option>
                    <option value="sadness">2. Sadness (Sedih)</option>
                    <option value="anger">3. Anger (Marah)</option>
                    <option value="envy">4. Envy (Iri/Motivasi)</option>
                </select>
            </div>

            <div id="rekomendasiArea">
                <!-- Rekomendasi lagu dari Python akan muncul di sini -->
            </div>

            <hr style="border:0; border-top:1px solid #333; margin: 20px 0;">

            <div class="form-group">
                <label>Nama Penerima</label>
                <input type="text" id="toName" class="form-control" placeholder="Nama temanmu...">
            </div>
            <div class="form-group">
                <label>Pesan Singkat</label>
                <textarea id="messageText" class="form-control" rows="2"></textarea>
            </div>
            <button class="btn-send" onclick="kirimPesan()">Kirim Pesan 🚀</button>
        </div>
    </main>

    <script>
        // Data dari Python dimasukkan ke dalam objek JS
        const dataLagu = {
            joy: ["Tulus - Hati-Hati di Jalan", "Nidji - Laskar Pelangi", "Pharrell Williams - Happy"],
            sadness: ["Mahalini - Sisa Rasa", "Lyodra - Pesan Terakhir", "Lewis Capaldi - Someone You Loved"],
            anger: ["Superman Is Dead - Jika Kami Bersama", ".Feast - Peradaban", "Imagine Dragons - Believer"],
            envy: ["Hindia - Evaluasi", "Nadin Amizah - Sorai", "Olivia Rodrigo - jealousy, jealousy"]
        };

        function tampilkanRekomendasi() {
            const mood = document.getElementById('songMood').value;
            const area = document.getElementById('rekomendasiArea');
            const lagu = dataLagu[mood];
            
            area.innerHTML = "<strong>Rekomendasi Lagu:</strong><ul>" + 
                lagu.map(l => `<li>${l}</li>`).join('') + "</ul>";
        }

        function kirimPesan() {
            alert("Pesan berhasil dikirim! Lagu '" + document.getElementById('songMood').value + "' telah diteruskan.");
        }

        // Jalankan sekali saat load
        tampilkanRekomendasi();
    </script>
</body>
</html>
