<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inside Out Music Mood</title>
<style>
body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
    padding:20px;
}
.container{
    max-width:800px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}
h1{
    text-align:center;
}
select, button{
    padding:10px;
    margin-top:10px;
}
#hasil{
    margin-top:20px;
    line-height:1.8;
}
</style>
</head>
<body>
<div class="container">
    <h1>🎵 INSIDE OUT MUSIC MOOD</h1>
    <h2>Google Colab Project</h2>
<p>
    <a href="https://colab.research.google.com/drive/ID_NOTEBOOK_KAMU" target="_blank">
        Buka Google Colab
    </a>
</p>
    <p>Pilih mood yang paling menggambarkan perasaanmu saat ini:</p>
    <select id="mood">
        <option value="">-- Pilih Mood --</option>
        <option value="joy">😊 Joy</option>
        <option value="sadness">😢 Sadness</option>
        <option value="anger">😡 Anger</option>
        <option value="envy">💚 Envy</option>
    </select>
    <button onclick="tampilkanMood()">Lihat Rekomendasi</button>
    <div id="hasil"></div>
</div>
<script>
function tampilkanMood(){
const mood = document.getElementById("mood").value;
const hasil = document.getElementById("hasil");
if(mood === "joy"){
hasil.innerHTML = `
<h2>😊 JOY (Bahagia)</h2>
<h3>Makna Emosi Pengirim</h3>
<p>Pengirim sedang merasa bahagia, bersyukur, bersemangat, atau ingin membagikan energi positif kepada orang lain.</p>
<h3>🎵 Rekomendasi Lagu Indonesia</h3>
<ul>
<li><b>Tulus - Hati-Hati di Jalan</b><br>Makna: Perpisahan yang tetap dihiasi doa dan ketulusan.</li>
<li><b>Nidji - Laskar Pelangi</b><br>Makna: Semangat mengejar mimpi.</li>
<li><b>HIVI! - Remaja</b><br>Makna: Kebahagiaan masa muda.</li>
<li><b>MALIQ & D'Essentials - Senja Teduh Pelita</b><br>Makna: Kehangatan dan ketenangan.</li>
<li><b>Sheila On 7 - Melompat Lebih Tinggi</b><br>Makna: Keberanian menghadapi tantangan.</li>
</ul>
`;
}
else if(mood === "sadness"){
hasil.innerHTML = `
<h2>😢 SADNESS (Sedih)</h2>
<h3>Makna Emosi Pengirim</h3>
<p>Pengirim sedang merasa sedih, kehilangan, kecewa, atau merindukan seseorang.</p>
<h3>🎵 Rekomendasi Lagu Indonesia</h3>
<ul>
<li><b>Mahalini - Sisa Rasa</b><br>Makna: Luka setelah perpisahan.</li>
<li><b>Lyodra - Pesan Terakhir</b><br>Makna: Mengikhlaskan seseorang.</li>
<li><b>Andmesh - Hanya Rindu</b><br>Makna: Kerinduan mendalam.</li>
<li><b>Feby Putri ft. Fiersa Besari - Runtuh</b><br>Makna: Kelelahan emosional.</li>
<li><b>Tulus - Monokrom</b><br>Makna: Mengenang seseorang yang berarti.</li>
</ul>
`;
}
else if(mood === "anger"){
hasil.innerHTML = `
<h2>😡 ANGER (Marah)</h2>
<h3>Makna Emosi Pengirim</h3>
<p>Pengirim sedang merasa marah, kesal, atau frustrasi terhadap suatu keadaan.</p>
<h3>🎵 Rekomendasi Lagu Indonesia</h3>
<ul>
<li><b>Superman Is Dead - Jika Kami Bersama</b><br>Makna: Solidaritas dan kekuatan.</li>
<li><b>.Feast - Peradaban</b><br>Makna: Kritik sosial.</li>
<li><b>Pee Wee Gaskins - Dibalik Hari Esok</b><br>Makna: Harapan untuk masa depan.</li>
<li><b>Burgerkill - Tiga Titik Hitam</b><br>Makna: Pergulatan batin.</li>
<li><b>Efek Rumah Kaca - Mosi Tidak Percaya</b><br>Makna: Kritik terhadap ketidakadilan.</li>
</ul>
`;
}
else if(mood === "envy"){
hasil.innerHTML = `
<h2>💚 ENVY (Iri)</h2>
<h3>Makna Emosi Pengirim</h3>
<p>Pengirim sedang membandingkan dirinya dengan orang lain atau merasa iri terhadap pencapaian seseorang.</p>
<h3>🎵 Rekomendasi Lagu Indonesia</h3>
<ul>
<li><b>Hindia - Evaluasi</b><br>Makna: Refleksi diri.</li>
<li><b>Nadin Amizah - Sorai</b><br>Makna: Belajar menerima kenyataan.</li>
<li><b>Kunto Aji - Rehat</b><br>Makna: Menghargai diri sendiri.</li>
<li><b>Tulus - Manusia Kuat</b><br>Makna: Tetap kuat menghadapi kesulitan.</li>
<li><b>Yura Yunita - Dunia Tipu-Tipu</b><br>Makna: Mensyukuri orang-orang tulus.</li>
</ul>
`;
}
else{
hasil.innerHTML = "<p>❌ Silakan pilih mood terlebih dahulu.</p>";
}
}
</script>
</body>
</html>
