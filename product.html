<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Pick the Song - Inside Out</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Pick the Song</h1>
        <p>Pilih moodmu hari ini, dan temukan lagu yang pas!</p>

        <!-- Pilihan Mood -->
        <div class="mood-selector">
            <button onclick="filterByMood('Joy 💛')" class="btn-mood joy">Joy 💛</button>
            <button onclick="filterByMood('Sadness 💙')" class="btn-mood sadness">Sadness 💙</button>
            <button onclick="filterByMood('Anger ❤️')" class="btn-mood anger">Anger ❤️</button>
            <button onclick="filterByMood('Envy 💚')" class="btn-mood envy">Envy 💚</button>
            <button onclick="filterByMood('all')" class="btn-mood all">Semua Lagu</button>
        </div>

        <!-- Daftar Lagu -->
        <div id="songList" class="grid-container"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="script.js"></script>
</body>
</html>
