<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send the Song - Inside Out</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    </head>
<body>
    <video autoplay muted loop playsinline class="video-bg">
        <source src="https://videotourl.com/videos/1780485019352-0868a29f-d876-44ca-b1f7-322c6c4baa89.mp4" type="video/mp4">
    </video>
    <div class="video-overlay"></div>

    <main class="container">
        <h1 class="page-title">SEND THE SONG</h1>
        <div class="grid-layout">
            <section class="card">
                <h2>send your message</h2>
                <form id="songForm">
                    <input type="text" id="toName" class="form-control" placeholder="Nama Tujuan" required>
                    <select id="songMood" class="form-control">
                        <option value="senang">Joy 💛</option>
                        <option value="marah">Anger ❤️</option>
                        <option value="sedih">Sadness 💙</option>
                        <option value="kecewa">Ennui/Fear 💜</option>
                    </select>
                    <input type="url" id="spotifyUrl" class="form-control" placeholder="Link Spotify" required>
                    <textarea id="messageText" class="form-control" placeholder="Pesanmu..."></textarea>
                    <button type="button" onclick="kirimPesan()" class="btn-send">Send 🚀</button>
                </form>
            </section>

            <section class="card">
                <h2>Cari Pesan</h2>
                <input type="text" id="searchName" class="form-control" oninput="searchMessages()" placeholder="Ketik namamu...">
                <div id="searchResultsArea" class="search-results"></div>
            </section>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="script.js"></script>
</body>
</html>
