<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inside Out Music Mood</title>
<style>
    /* CSS BARU UNTUK BACKGROUND VIDEO */
    body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: auto;
    }
    #bg-video {
        position: fixed;
        right: 0;
        bottom: 0;
        min-width: 100%;
        min-height: 100%;
        width: auto;
        height: auto;
        z-index: -1; /* Agar video selalu di belakang */
        object-fit: cover;
    }

    body {
        font-family: Arial, sans-serif;
        padding: 20px;
    }
    .container {
        max-width: 800px;
        margin: 50px auto;
        background: rgba(255, 255, 255, 0.85); /* Dibuat sedikit transparan agar video terlihat */
        padding: 20px;
        border-radius: 15px;
        box-shadow: 0 0 20px rgba(0,0,0,0.3);
        backdrop-filter: blur(5px); /* Efek blur agar teks lebih terbaca */
    }
    h1 { text-align: center; }
    select, button { padding: 10px; margin-top: 10px; width: 100%; }
    #hasil { margin-top: 20px; line-height: 1.8; }
</style>
</head>
<body>

    <!-- ELEMEN VIDEO -->
    <video autoplay muted loop id="bg-video">
        <source src="https://videotourl.com/videos/1780485019352-0868a29f-d876-44ca-b1f7-322c6c4baa89.mp4" type="video/mp4">
        Browser kamu tidak mendukung tag video.
    </video>

    <div class="container">
        <h1>🎵 INSIDE OUT MUSIC MOOD</h1>
        <p style="text-align:center;">
            <a href="https://colab.research.google.com/drive/ID_NOTEBOOK_KAMU" target="_blank">Buka Google Colab</a>
        </p>
        
        <p>Pilih mood yang paling menggambarkan perasaanmu saat ini:</p>
        <select id="mood">
            <option value="">-- Pilih Mood --</option>
            <option value="joy">😊 Joy</option>
            <option value="sadness">😢 Sadness</option>
            <option value="anger">😡 Anger</option>
            <option value="envy">💚 Envy</option>
        </select>
        <button onclick="tampilkanMood()">Lihat Rekomendasi</button>
        <div id="hasil"></div>
    </div>

<script>
    // ... (Script JavaScript kamu tetap sama) ...
    function tampilkanMood(){
        const mood = document.getElementById("mood").value;
        const hasil = document.getElementById("hasil");
        
        const data = {
            joy: { judul: "😊 JOY (Bahagia)", desc: "Pengirim sedang merasa bahagia dan penuh energi.", lagu: ["Tulus - Hati-Hati di Jalan", "Nidji - Laskar Pelangi", "HIVI! - Remaja", "MALIQ & D'Essentials - Senja Teduh Pelita", "Sheila On 7 - Melompat Lebih Tinggi"] },
            sadness: { judul: "😢 SADNESS (Sedih)", desc: "Pengirim sedang merasa sedih atau kehilangan.", lagu: ["Mahalini - Sisa Rasa", "Lyodra - Pesan Terakhir", "Andmesh - Hanya Rindu", "Feby Putri ft. Fiersa Besari - Runtuh", "Tulus - Monokrom"] },
            anger: { judul: "😡 ANGER (Marah)", desc: "Pengirim sedang merasa kesal atau frustrasi.", lagu: ["Superman Is Dead - Jika Kami Bersama", ".Feast - Peradaban", "Pee Wee Gaskins - Dibalik Hari Esok", "Burgerkill - Tiga Titik Hitam", "Efek Rumah Kaca - Mosi Tidak Percaya"] },
            envy: { judul: "💚 ENVY (Iri)", desc: "Pengirim sedang membandingkan diri atau merasa iri.", lagu: ["Hindia - Evaluasi", "Nadin Amizah - Sorai", "Kunto Aji - Rehat", "Tulus - Manusia Kuat", "Yura Yunita - Dunia Tipu-Tipu"] }
        };

        if(data[mood]) {
            let listLagu = data[mood].lagu.map(l => `<li>${l}</li>`).join("");
            hasil.innerHTML = `<h2>${data[mood].judul}</h2><p>${data[mood].desc}</p><h3>Rekomendasi Lagu:</h3><ul>${listLagu}</ul>`;
        } else {
            hasil.innerHTML = "<p>❌ Silakan pilih mood terlebih dahulu.</p>";
        }
    }
</script>
</body>
</html>
