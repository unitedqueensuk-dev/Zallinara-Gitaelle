<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send the Song - Inside Out</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        /* ... (CSS ASLIMU TETAP SAMA, HANYA TAMBAHKAN INI) ... */
        .result-box { background: rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 20px; margin-top: 20px; text-align: center; border: 1px solid #ffd700; }
        .mood-badge { font-size: 1.5rem; font-weight: bold; color: #ffd700; margin-top: 10px; }
    </style>
</head>
<body>

    <video autoplay muted loop playsinline class="video-bg">
        <source src="https://videotourl.com/videos/1780485019352-0868a29f-d876-44ca-b1f7-322c6c4baa89.mp4" type="video/mp4">
    </video>
    <div class="video-overlay"></div>

    <header>
        <div class="logo">Inside Out</div>
    </header>

    <main class="container">
        <h1 class="page-title">SEND THE SONG</h1>
        <p class="page-subtitle">Ketik judul lagu, dan sistem akan mendeteksi mood-nya!</p>

        <section class="card" style="max-width: 600px; margin: auto;">
            <h2>Deteksi Mood Lagu</h2>
            <div class="form-group">
                <label>Judul Lagu</label>
                <input type="text" id="songTitle" class="form-control" placeholder="Contoh: Laskar Pelangi">
            </div>
            <button onclick="cekMood()" class="btn-send">Deteksi & Kirim 🚀</button>

            <div id="hasilArea"></div>
        </section>
    </main>

    <script>
        // Database lagu dari Python kamu
        const databaseLagu = {
            "joy": ["Hati-Hati di Jalan", "Laskar Pelangi", "Remaja", "Senja Teduh Pelita", "Melompat Lebih Tinggi", "Happy", "Best Day of My Life", "Golden Hour", "Count on Me", "Walking on Sunshine"],
            "sadness": ["Sisa Rasa", "Pesan Terakhir", "Hanya Rindu", "Runtuh", "Monokrom", "Someone You Loved", "All I Want", "Drivers License", "Heather", "Let Her Go"],
            "anger": ["Jika Kami Bersama", "Peradaban", "Dibalik Hari Esok", "Tiga Titik Hitam", "Mosi Tidak Percaya", "Believer", "Whatever It Takes", "Stronger", "Numb", "Enemy"],
            "envy": ["Evaluasi", "Sorai", "Rehat", "Manusia Kuat", "Dunia Tipu-Tipu", "jealousy, jealousy", "envy me", "Blue", "Arcade", "Unstoppable"]
        };

        function cekMood() {
            const judul = document.getElementById('songTitle').value.trim();
            const hasilArea = document.getElementById('hasilArea');
            let moodTerdeteksi = "Tidak ditemukan dalam daftar kami";
            let warna = "#fff";

            // Mencari judul di database
            for (let mood in databaseLagu) {
                if (databaseLagu[mood].map(s => s.toLowerCase()).includes(judul.toLowerCase())) {
                    moodTerdeteksi = mood.toUpperCase();
                    warna = (mood === 'joy') ? '#ffd700' : (mood === 'sadness') ? '#0088ff' : (mood === 'anger') ? '#ff3333' : '#b19ffb';
                }
            }

            hasilArea.innerHTML = `
                <div class="result-box">
                    <p>Lagu: <strong>${judul}</strong></p>
                    <p>Mood Terdeteksi:</p>
                    <div class="mood-badge" style="color:${warna}">${moodTerdeteksi}</div>
                </div>
            `;
        }
    </script>
</body>
</html>
