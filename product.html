<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Send the Song - Inside Out</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <video autoplay muted loop playsinline class="video-bg">
        <source src="https://videotourl.com/videos/1780485019352-0868a29f-d876-44ca-b1f7-322c6c4baa89.mp4" type="video/mp4">
    </video>
    <div class="video-overlay"></div>

    <div class="container">
        <h1>Send the Song</h1>

        <div class="card">
            <input type="text" id="targetName" placeholder="Nama yang dituju...">
            
            <select id="moodSelect">
                <option value="Joy 💛">Joy 💛</option>
                <option value="Angry ❤️">Angry ❤️</option>
                <option value="Envy 💚">Envy 💚</option>
                <option value="Sadness 💙">Sadness 💙</option>
            </select>
            
            <input type="text" id="spotifyLink" placeholder="Link Spotify">
            <textarea id="message" placeholder="Tulis pesanmu..."></textarea>
            
            <button onclick="kirimPesan()">Kirim Pesan</button>
        </div>

        <input type="text" id="searchInput" placeholder="Cari nama tujuan..." onkeyup="filterPesan()">

        <div id="pesanList" class="grid-container"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="script.js"></script>
</body>
</html>
